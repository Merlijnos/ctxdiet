name: "ctxdiet"
description: "Fail the build when your AI coding-agent context exceeds a token budget or a quality grade."
branding:
  icon: "scissors"
  color: "green"
inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  max-tokens:
    description: "Fail if context exceeds this many tokens"
    required: false
  fail-on:
    description: "Fail if the grade is worse than this (A-F)"
    required: false
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        CTXDIET_PATH: ${{ inputs.path }}
        CTXDIET_MAX: ${{ inputs.max-tokens }}
        CTXDIET_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(--path "$CTXDIET_PATH")
        if [ -n "$CTXDIET_MAX" ]; then args+=(--max-tokens "$CTXDIET_MAX"); fi
        if [ -n "$CTXDIET_FAIL_ON" ]; then args+=(--fail-on "$CTXDIET_FAIL_ON"); fi
        npx ctxdiet@latest "${args[@]}"
